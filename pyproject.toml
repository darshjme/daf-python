[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daf-agent-adapter"
version = "0.1.0"
description = "Portable bounded command adapters for Darshj's Agent Framework"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Darshankumar Joshi", email = "darsh@darshj.ai"}]
readme = "README.md"
dependencies = []

[project.scripts]
daf-adapter-py = "daf_adapter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
